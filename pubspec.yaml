name: kelasxtra_app
description: Aplikasi mobile KelasXtra (Flutter + Riverpod)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Network
  dio: ^5.5.0
  retrofit: ^4.1.0
  pretty_dio_logger: ^1.3.1

  # Model / serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Storage token (aman, bukan SharedPreferences biasa)
  flutter_secure_storage: ^9.2.2

  # Util
  intl: ^0.19.0
  equatable: ^2.0.5
  connectivity_plus: ^6.0.5

  # Webview untuk Midtrans Snap (checkout)
  webview_flutter: ^4.8.0

  cupertino_icons: ^1.0.8
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Codegen
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  retrofit_generator: ^8.1.2

  # Lint tambahan khusus riverpod (opsional tapi direkomendasikan)
  riverpod_lint: ^2.3.10
  custom_lint: ^0.6.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
